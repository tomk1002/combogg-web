<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>combo.gg — 게임 콤보 공유 플랫폼</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--font-family-base);
      color: var(--gray-900);
      background: var(--gray-100);
    }
    button, input, select, textarea { font-family: var(--font-family-base); }
    @keyframes blinkLive { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes comboFlash {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(0.4); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.4); }
    }
    @keyframes hitRing {
      0% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.4); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.6); }
    }
    select::-ms-expand { display: none; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="components/data.js"></script>
  <script type="text/babel" src="components/keycap.jsx"></script>
  <script type="text/babel" src="components/combo-card.jsx"></script>
  <script type="text/babel" src="components/site-header.jsx"></script>
  <script type="text/babel" src="components/home-page.jsx"></script>
  <script type="text/babel" src="components/detail-page.jsx"></script>
  <script type="text/babel" src="components/upload-page.jsx"></script>
  <script type="text/babel" src="components/profile-page.jsx"></script>
  <script type="text/babel" src="components/login-page.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "cardVariant": "A",
      "showAuthorAccent": true
    }/*EDITMODE-END*/;

    // ─── ROUTER ──────────────────────────────────────────────────────────
    // Hash-based routing. Routes:
    //   /                  → home
    //   /combo/:id         → detail
    //   /upload            → upload
    //   /u/:handle         → profile
    //   /login             → login
    const useRoute = () => {
      const [path, setPath] = useState(() => window.location.hash.slice(1) || "/");
      useEffect(() => {
        const onHash = () => setPath(window.location.hash.slice(1) || "/");
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      const navigate = (p) => {
        window.location.hash = p;
        window.scrollTo(0, 0);
      };
      return [path, navigate];
    };

    const App = () => {
      const [path, navigate] = useRoute();
      const [user, setUser] = useState(null);
      const [tweaks, setTweak] = window.useTweaks
        ? window.useTweaks(TWEAK_DEFAULTS)
        : [TWEAK_DEFAULTS, () => {}];

      // Match routes
      let page;
      const m = (re) => path.match(re);

      if (m(/^\/(home)?$/)) {
        page = <HomePage navigate={navigate} currentPath={path} user={user} cardVariant={tweaks.cardVariant} />;
      } else if (m(/^\/combo\/(\w+)$/)) {
        const id = path.split("/")[2];
        const combo = COMBOS.find((c) => c.id === id) || COMBOS[0];
        page = <ComboDetailPage combo={combo} navigate={navigate} currentPath={path} user={user} />;
      } else if (path === "/upload") {
        page = <UploadPage navigate={navigate} currentPath={path} user={user} />;
      } else if (m(/^\/u\/(.+)$/)) {
        const handle = decodeURIComponent(path.split("/")[2]);
        page = <ProfilePage handle={handle} navigate={navigate} currentPath={path} user={user} />;
      } else if (path === "/login") {
        page = <LoginPage navigate={navigate} onLogin={setUser} />;
      } else {
        page = (
          <div style={{ padding: 80, textAlign: "center", fontFamily: "var(--font-family-base)" }}>
            <h1 style={{ fontSize: 48, fontWeight: 800, color: "#212121", margin: 0 }}>404</h1>
            <p style={{ fontSize: 14, color: "#757575" }}>페이지를 찾을 수 없습니다.</p>
            <button
              onClick={() => navigate("/")}
              style={{ marginTop: 16, height: 36, padding: "0 16px", borderRadius: 7, background: "#1A1D24", color: "#FFFFFF", border: 0, fontWeight: 700, cursor: "pointer" }}
            >
              홈으로
            </button>
          </div>
        );
      }

      return (
        <>
          {page}
          {window.TweaksPanel && (
            <TweaksPanel title="Tweaks">
              <TweakSection title="콤보 카드 스타일">
                <TweakSelect
                  label="카드 variant"
                  value={tweaks.cardVariant}
                  onChange={(v) => setTweak("cardVariant", v)}
                  options={[
                    { value: "A", label: "A — Standard (KPP 기본)" },
                    { value: "B", label: "B — Compact (가로 리스트)" },
                    { value: "C", label: "C — Hero (피처드, 다크)" },
                    { value: "D", label: "D — Spec (데이터 풍부)" },
                  ]}
                />
              </TweakSection>
              <TweakSection title="페이지 이동">
                <TweakButton onClick={() => navigate("/")}>홈</TweakButton>
                <TweakButton onClick={() => navigate("/combo/3")}>콤보 상세 (제드)</TweakButton>
                <TweakButton onClick={() => navigate("/combo/6")}>콤보 상세 (리신)</TweakButton>
                <TweakButton onClick={() => navigate("/upload")}>업로드</TweakButton>
                <TweakButton onClick={() => navigate("/u/InsecGod")}>프로필</TweakButton>
                <TweakButton onClick={() => navigate("/login")}>로그인</TweakButton>
              </TweakSection>
              <TweakSection title="컴포넌트 갤러리">
                <TweakButton onClick={() => window.open("components.html", "_blank")}>
                  디자인 캔버스 열기 →
                </TweakButton>
              </TweakSection>
            </TweaksPanel>
          )}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
